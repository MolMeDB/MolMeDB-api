name: Frontend CI

on:
  pull_request:
    branches: [develop, main]
    paths: &frontend_paths
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [develop, main]
    paths: *frontend_paths

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: ESLint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # This codebase has never been linted before (no ESLint config
      # existed until this workflow was introduced — Next.js 16 also
      # dropped the old `next lint` command entirely). Rather than a
      # big-bang cleanup of ~280 pre-existing findings, only enforce
      # style on files actually touched by this PR/push.
      - name: Determine changed frontend files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No comparable base commit found — skipping lint (nothing to diff against, e.g. first push of a branch)."
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- 'frontend/*.ts' 'frontend/*.tsx' | sed 's#^frontend/##' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Run ESLint on changed files
        if: steps.changed.outputs.files != ''
        run: npx eslint ${{ steps.changed.outputs.files }}

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          # next build statically imports route modules while collecting
          # page data, which touches lib/api/cookies.ts — it no longer
          # requires this to be set (the check is lazy, only enforced at
          # actual sign/verify time), but keep a placeholder in case a
          # future code path adds another build-time-evaluated secret.
          JWT_SECRET: ci-build-placeholder

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright's OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Playwright's webServer config builds nothing itself — it just runs
      # the mock backend and `next start` against an already-built .next/.
      - run: npm run build

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
