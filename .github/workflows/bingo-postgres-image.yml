name: Build bingo Postgres CI image

# Builds the Postgres 15 + bingo cartridge image used as the test database
# for backend CI (smiles / substructure search needs the real extension —
# it cannot run against sqlite). Published to GHCR so backend-ci.yml can
# pull a ready image as a `services:` container instead of rebuilding it
# on every run.
on:
  push:
    branches: [develop, main]
    paths:
      - "database/extensions/bingo/**"
      - ".github/workflows/bingo-postgres-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/molmedb/ci-bingo-postgres

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: database/extensions/bingo
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:15
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
