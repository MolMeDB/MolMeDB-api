upload_max_filesize = 20M
post_max_size = 24M

; The queue:work --memory=256 flag on the predictions worker (see
; docker-compose-production.yaml) is Laravel's own soft, between-jobs check -
; it never raises PHP's actual memory_limit. The stock php.ini-production
; value (128M) is below that assumed threshold, so a single memory-heavy job
; can hard-crash with a FatalError before Laravel's graceful check ever runs.
memory_limit = 384M
