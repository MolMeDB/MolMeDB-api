events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Limit concurrent PHP-FPM connections globally (protects workers from crawler floods).
    # Key is $server_name so the cap applies across all clients combined, not per-IP
    # (per-IP would not help when all requests come from one frontend container).
    limit_conn_zone $server_name zone=php_conn:1m;

    # Secondary per-IP cap so a single external IP cannot monopolise all slots.
    limit_conn_zone $binary_remote_addr zone=php_conn_ip:10m;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    map $http_x_forwarded_proto $fastcgi_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_host $fastcgi_forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    map $http_x_forwarded_port $fastcgi_forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    server {
        listen 443;
        listen [::]:443;
        server_name localhost;
        root /var/www/public;
    
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    
        index index.php;
    
        charset utf-8;
    
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    
        error_page 404 /index.php;

        location ~ \.php$ {
            # Allow at most 40 concurrent PHP requests in total and 10 per source IP.
            # Requests beyond the limit get 503 immediately instead of piling up and
            # causing chain-reaction timeouts across all workers.
            limit_conn php_conn    40;
            limit_conn php_conn_ip 10;
            limit_conn_status 503;

            fastcgi_pass app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PROTO $fastcgi_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $fastcgi_forwarded_host;
            fastcgi_param HTTP_X_FORWARDED_PORT $fastcgi_forwarded_port;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
